services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: blog_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=blog_app
            - DB_USERNAME=laravel
            - DB_PASSWORD=secret
        networks:
            - blog

    nginx:
        image: nginx:alpine
        container_name: blog_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - blog

    mysql:
        image: mysql:8.0
        container_name: blog_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: blog_app
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_PASSWORD: secret
            MYSQL_USER: laravel
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - blog

    node:
        image: node:20-alpine
        container_name: blog_node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        profiles:
            - tools

networks:
    blog:
        driver: bridge

volumes:
    mysql_data:
        driver: local
